name: Build PS3 game

on:
  push:
  workflow_dispatch:

env:
  PS3DEV: /home/runner/ps3dev
  PSL1GHT: /home/runner/ps3dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/ps3dev
          key: ps3dev-toolchain-v1

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y autoconf bison build-essential flex git
          libelf-dev libgmp3-dev libncurses5-dev libssl-dev libtool-bin
          pkg-config python-dev-is-python3 texinfo wget zlib1g-dev

      - name: Build toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/ps3dev
          key: ps3dev-toolchain-v1

      - name: Build game
        run: |
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: minimario
          path: |
            minimario.self
            minimario.elf
